app:
  image: ghcr.io/joeckr/python
  name: oci-python
  env: "dev"
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 1031 # take this out if deploying to OpenShift
  port: 8080
  pullPolicy: Always
  replicaCount: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  tag: latest
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

service:
  name: template-service
  port: 8080
  type: NodePort
